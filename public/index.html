<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darb front desk</title>
<meta name="description" content="Prototype chat with the Widem agent desk for Darb, a fictional career studio. Demo only.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f6e5a%22/%3E%3Cpath d=%22M9 22h14M12 22c0-6 4-9 8-11%22 stroke=%22%23f6fbf9%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f0; --surface: #fbfcfb; --ink: #13212e; --muted: #4c5a64; --line: #d3dad8;
  --accent: #0f6e5a; --on-accent: #f6fbf9; --accent-soft: #dcebe5; --you: #13212e; --on-you: #f2f5f4;
  --warn: #8a3b12; --warn-soft: #f6e6dc;
  --radius: 14px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1920; --surface: #15232c; --ink: #e4ebe9; --muted: #9caeb5; --line: #2a3a44;
    --accent: #5fc3a4; --on-accent: #0b1a15; --accent-soft: #183a31; --you: #dfe7e4; --on-you: #10202a;
    --warn: #f0a37c; --warn-soft: #3a2419; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1920; --surface: #15232c; --ink: #e4ebe9; --muted: #9caeb5; --line: #2a3a44;
  --accent: #5fc3a4; --on-accent: #0b1a15; --accent-soft: #183a31; --you: #dfe7e4; --on-you: #10202a;
  --warn: #f0a37c; --warn-soft: #3a2419; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr; max-width: 1180px; margin-inline: auto; padding-inline: 16px; }
.demo {
  margin-block-start: 12px; padding: 8px 14px; border-radius: 10px;
  background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500;
}
header { display: flex; align-items: center; gap: 12px; padding-block: 18px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-inline-end: auto; }
.brand b { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
.brand span { color: var(--muted); font-size: 14px; white-space: nowrap; }
@media (max-width: 420px) { .brand span { display: none; } .btn { padding-inline: 12px; } }
.btn {
  min-height: 44px; padding-inline: 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: transform 140ms var(--ease-out), background-color 140ms ease;
}
.btn:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--accent-soft); } }

.desk { display: grid; gap: 16px; padding-block-end: 16px; min-height: 0; }
@media (min-width: 900px) {
  .desk { grid-template-columns: minmax(0, 1fr) 320px; height: calc(100dvh - 140px); }
}

/* Chat */
.chat { display: grid; grid-template-rows: 1fr auto; min-height: 60dvh; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.log { overflow-y: auto; overflow-x: hidden; padding: 20px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { max-width: min(78%, 34rem); padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.desk-msg { align-self: flex-start; background: var(--accent-soft); border-start-start-radius: 4px; }
.msg.you { align-self: flex-end; background: var(--you); color: var(--on-you); border-start-end-radius: 4px; }
.msg.note { align-self: center; max-width: 100%; background: none; color: var(--muted); font-size: 14px; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .msg, .act li { animation: enter 220ms var(--ease-out) both; }
}
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding-inline: 4px; }
.typing::after { content: "..."; display: inline-block; width: 1.2em; text-align: start; }
@media (prefers-reduced-motion: no-preference) {
  .typing::after { animation: dots 1s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; }
}
@keyframes dots { from { width: 0; } to { width: 1.2em; } }

.empty { margin: auto; text-align: center; max-width: 30rem; padding: 24px 8px; }
.empty h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.01em; }
.empty p { color: var(--muted); margin: 0 0 20px; }
.starters .btn { white-space: normal; text-align: center; }
.starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

#form { display: flex; gap: 8px; padding: 12px; border-block-start: 1px solid var(--line); background: var(--surface); }
textarea {
  flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); line-height: 1.5;
}
textarea::placeholder { color: var(--muted); opacity: 1; }
.send { background: var(--accent); color: var(--on-accent); border-color: transparent; min-width: 88px; }
@media (hover: hover) and (pointer: fine) { .send:hover { background: var(--accent); filter: brightness(1.08); } }
.send:disabled { opacity: 0.55; cursor: progress; }

/* Desk activity: the receipt of what the desk actually did */
.act { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; min-height: 0; overflow: auto; }
.act summary { list-style: none; cursor: pointer; padding: 16px 18px 6px; font-weight: 600; min-height: 44px; }
.act summary::-webkit-details-marker { display: none; }
.act .hint { margin: 0; padding: 0 18px 12px; color: var(--muted); font-size: 14px; }
.act ol { list-style: none; margin: 0; padding: 0 18px 18px; display: grid; gap: 10px; }
.act li { border-block-start: 1px dashed var(--line); padding-block-start: 10px; font-size: 14px; }
.act .tool { color: var(--muted); }
.act .fact { font-weight: 500; }
.act .ref {
  display: block; margin-block: 6px 2px; font-size: 34px; font-weight: 600; line-height: 1.1;
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--accent); direction: ltr; text-align: start;
}
.act .bad { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }
/* Widgets under the desk's message: built by the server from tool results, never from the model's words */
.widgets { align-self: flex-start; width: min(100%, 34rem); display: grid; gap: 10px; }
.widgets[inert] .go, .widgets[inert] .more { display: none; }
.widgets[inert] form.picker { display: none; } /* an answer in the composer moved on: no empty fields left behind */
.sent { margin: 0; color: var(--muted, inherit); font-size: 14px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: 3px; }
.card .row span:last-child, .chip { font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .tier { color: var(--muted); font-size: 14px; }
.card .total { border-block-start: 1px solid var(--line); margin-block-start: 8px; padding-block-start: 10px; font-weight: 600; }
.card .total span:last-child { font-size: 26px; line-height: 1.1; color: var(--accent); }
.day { margin: 8px 0 6px; font-size: 14px; color: var(--muted); }
.day:first-of-type { margin-block-start: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; min-width: 76px; padding-inline: 14px; border-radius: 999px; border: 1px solid var(--accent);
  background: var(--surface); cursor: pointer; font-weight: 500; transition: transform 140ms var(--ease-out), background-color 140ms ease; }
.chip:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .chip:hover { background: var(--accent-soft); } }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.slotset:not(.open) [data-extra] { display: none; }
.more { margin-block-start: 10px; }
.picker fieldset { border: 0; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; min-width: 0; }
.picker legend { font-weight: 600; font-size: 15px; padding: 0; margin-block-end: 6px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.4; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.field { display: grid; gap: 4px; margin-block-end: 10px; }
.field label { font-size: 14px; font-weight: 500; }
.field input { min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--muted); background: var(--surface); width: 100%; }
.err { color: var(--warn); font-size: 14px; margin: 0 0 8px; }
.err:empty { display: none; }
.go { justify-self: start; background: var(--accent); color: var(--on-accent); border-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .widgets { animation: enter 220ms var(--ease-out) both; } }
</style>
</head>
<body>
<div class="app">
  <p class="demo" id="demo"></p>
  <header>
    <div class="brand"><b id="brand"></b><span id="sub"></span></div>
    <button class="btn" id="lang" type="button"></button>
    <button class="btn" id="reset" type="button"></button>
  </header>
  <main class="desk">
    <section class="chat" aria-labelledby="chat-title">
      <h2 class="sr" id="chat-title"></h2>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <form id="form">
        <label class="sr" for="input" id="input-label"></label>
        <textarea id="input" rows="1" dir="auto" maxlength="2000" autocomplete="off"></textarea>
        <button class="btn send" id="send" type="submit"></button>
      </form>
    </section>
    <details class="act" id="act">
      <summary id="act-title"></summary>
      <p class="hint" id="act-hint"></p>
      <ol id="act-list"></ol>
    </details>
  </main>
</div>
<noscript><p style="padding:16px">This chat needs JavaScript. / هذه المحادثة تحتاج إلى JavaScript.</p></noscript>
<script>
const STR = {
  ar: {
    demo: 'درب شركة وهمية لأغراض العرض فقط. الأسعار والمواعيد هنا للتجربة، ولا يصل أي حجز إلى شخص حقيقي.',
    brand: 'درب', sub: 'مكتب الاستقبال', lang: 'English', reset: 'محادثة جديدة', chat: 'المحادثة',
    label: 'رسالتك', placeholder: 'اكتب رسالتك هنا', send: 'إرسال',
    title: 'كيف نقدر نساعدك في مسارك المهني؟',
    lead: 'اسأل عن الخدمات والأسعار، أو احجز مكالمة تعارف. المكتب يسعّر من جدول الأسعار مباشرة.',
    starters: ['أبغى أحجز مراجعة سيرة ذاتية، عندي خبرة ٦ سنوات', 'كم سعر باقة السيرة الذاتية مع لينكدإن؟', 'ممكن خصم؟'],
    typing: 'المكتب يكتب', act: 'ما يحدث في المكتب', hint: 'كل ما يفعله المكتب خلف الرد يظهر هنا: التسعير، المواعيد، الحجز، والتحويل لموظف.',
    quote: 'محرك التسعير', avail: 'فحص المواعيد', book: 'حجز', handover: 'تحويل إلى موظف', list: 'قائمة الخدمات',
    slots: (n) => `${n} موعد متاح`, subtotal: 'قبل الخصم', discount: 'خصم الباقة', total: 'الإجمالي',
    refused: 'رفض بسبب', sar: 'ريال', turn: (n) => `الرسالة ${n}`,
    busy: 'المكتب مشغول الآن. انتظر دقيقة ثم أعد الإرسال.', down: 'تعذّر الوصول إلى المكتب. تأكد أن الخادم يعمل ثم أعد الإرسال.',
    ended: 'انتهت هذه المحادثة. بدأنا محادثة جديدة، أعد إرسال رسالتك.',
  },
  en: {
    demo: 'Darb is a fictional business, for demo only. Prices and times are for testing, and no booking reaches a real person.',
    brand: 'Darb', sub: 'Front desk', lang: 'العربية', reset: 'New chat', chat: 'Chat',
    label: 'Your message', placeholder: 'Type your message', send: 'Send',
    title: 'How can we help with your career?',
    lead: 'Ask about services and prices, or book a kickoff call. The desk prices straight from the price list.',
    starters: ['I want to book a CV review, I have 6 years of experience', 'How much is the CV and LinkedIn bundle?', 'Can I get a discount?'],
    typing: 'The desk is typing', act: 'Desk activity', hint: 'Everything the desk does behind a reply shows here: pricing, free slots, bookings and handovers to a person.',
    quote: 'Quote engine', avail: 'Free slots checked', book: 'Booked', handover: 'Handed to a person', list: 'Service list',
    slots: (n) => `${n} free slots`, subtotal: 'Subtotal', discount: 'Bundle discount', total: 'Total',
    refused: 'Refused:', sar: 'SAR', turn: (n) => `Message ${n}`,
    busy: 'The desk is busy right now. Wait a minute, then send again.', down: 'Could not reach the desk. Check the server is running, then send again.',
    ended: 'That chat had ended, so a new one started. Send your message again.',
  },
};
const $ = (id) => document.getElementById(id);
const state = { lang: 'ar', sessionId: null, turns: 0, busy: false };
const t = () => STR[state.lang];

function applyLang() {
  const s = t();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  for (const k of ['demo', 'brand', 'sub', 'lang', 'reset']) $(k).textContent = s[k];
  $('chat-title').textContent = s.chat; $('input-label').textContent = s.label;
  $('input').placeholder = s.placeholder; $('send').textContent = s.send;
  $('act-title').textContent = s.act; $('act-hint').textContent = s.hint;
  if (!$('log').children.length || $('log').querySelector('.empty')) renderEmpty();
}
function renderEmpty() {
  const s = t(); const log = $('log'); log.replaceChildren();
  const box = el('div', 'empty');
  box.append(el('h1', '', s.title), el('p', '', s.lead));
  const row = el('div', 'starters');
  for (const text of s.starters) {
    const b = el('button', 'btn', text); b.type = 'button'; b.dir = 'auto';
    b.addEventListener('click', () => send(text)); row.append(b);
  }
  box.append(row); log.append(box);
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function addMsg(kind, text) {
  const log = $('log'); log.querySelector('.empty')?.remove();
  const m = el('div', `msg ${kind}`, text); m.dir = 'auto'; log.append(m);
  log.scrollTop = log.scrollHeight; return m;
}
const money = (n) => `${Number(n).toLocaleString('en-US')} ${t().sar}`;
function slotLabel(iso) {
  try { return new Intl.DateTimeFormat(state.lang === 'ar' ? 'ar-SA-u-nu-latn-ca-gregory' : 'en-GB',
    { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Riyadh' }).format(new Date(iso)); }
  catch { return iso; }
}
function logActivity(json) {
  const s = t(); const list = $('act-list');
  const items = [...(json.activity ?? [])];
  if (json.handover && !items.some((a) => a.handover === json.handover.id)) items.push({ tool: 'handover', ok: true, handover: json.handover.id });
  for (const a of items) {
    const li = el('li');
    li.append(el('span', 'tool', `${s.turn(state.turns)} · ${s[{ quote: 'quote', check_availability: 'avail', book: 'book', handover: 'handover', list_services: 'list' }[a.tool]] ?? a.tool}`));
    if (!a.ok && !a.handover) li.append(el('div', 'bad', `${s.refused} ${a.code ?? 'error'}`));
    if (a.tool === 'quote' && a.ok) {
      if (a.discount) li.append(el('div', 'num', `${s.subtotal}: ${money(a.subtotal)}`), el('div', 'num', `${s.discount}: ${money(a.discount)}`));
      li.append(el('div', 'fact num', `${s.total}: ${money(a.total)}`));
    }
    if (a.tool === 'check_availability' && a.ok) li.append(el('div', 'fact', s.slots(a.slots)));
    if (a.reference) li.append(el('span', 'ref', a.reference), el('div', 'fact', slotLabel(a.slot)), el('div', 'num', money(a.total)));
    if (a.handover) li.append(el('span', 'ref', a.handover));
    list.prepend(li);
  }
}
// Widget strings, in the language of the reply they sit under.
const W = {
  ar: { quote: 'عرض السعر من جدول الأسعار', tier: 'المستوى', discount: 'خصم الباقة', total: 'الإجمالي', cur: 'ريال',
    times: 'اختر موعد مكالمة البداية', more: (n) => `عرض ${n} مواعيد أخرى`, slotMsg: (l) => `أختار موعد ${l}`,
    level: 'خبرتك', services: 'الخدمات التي تريدها', sendDetails: 'أرسل التفاصيل', needDetails: 'اختر مستواك وخدمة واحدة على الأقل.',
    detailsMsg: (tier, s) => `مستواي: ${tier}. الخدمات: ${s.join('، ')}.`,
    contactTitle: 'بياناتك للحجز', name: 'الاسم', contact: 'البريد الإلكتروني أو رقم الجوال', sendContact: 'أرسل بياناتي',
    needContact: 'اكتب اسمك، ثم بريدًا إلكترونيًا أو رقم جوال صحيحًا.', contactMsg: (n, c) => `اسمي ${n}، وللتواصل: ${c}`, sentAs: (n, c) => `أُرسل: ${n} · ${c}` },
  en: { quote: 'Quote from the price list', tier: 'Level', discount: 'Bundle discount', total: 'Total', cur: 'SAR',
    times: 'Pick a time for the kickoff call', more: (n) => `Show ${n} more times`, slotMsg: (l) => `I'll take ${l}`,
    level: 'Your experience', services: 'Services you want', sendDetails: 'Send details', needDetails: 'Pick your level and at least one service.',
    detailsMsg: (tier, s) => `My level: ${tier}. Services: ${s.join(', ')}.`,
    contactTitle: 'Your details for the booking', name: 'Name', contact: 'Email or mobile number', sendContact: 'Send my details',
    needContact: 'Enter your name, then a valid email or mobile number.', contactMsg: (n, c) => `My name is ${n}, contact: ${c}`, sentAs: (n, c) => `Sent: ${n} · ${c}` },
};
let uid = 0;
const nextId = () => `w${++uid}`;
const nm = (o, lang) => o[`name_${lang}`] ?? o.name_en;
const cash = (n, lang) => `${Number(n).toLocaleString('en-US')} ${W[lang].cur}`;
function row(a, b, cls) { const r = el('div', cls ? `row ${cls}` : 'row'); r.append(el('span', '', a), el('span', '', b)); return r; }
function titled(tag, title) {
  const box = el(tag, 'card'); const h = el('h3', '', title); h.id = nextId();
  box.setAttribute('aria-labelledby', h.id); box.append(h); return box;
}
function quoteCard(w, lang) {
  const s = W[lang]; const c = titled('section', s.quote);
  for (const l of w.lines) c.append(row(nm(l, lang), cash(l.price, lang)));
  for (const a of w.addons ?? []) if (a.price != null) c.append(row(nm(a, lang), cash(a.price, lang)));
  if (w.discount) c.append(row(s.discount, `- ${cash(w.discount, lang)}`));
  c.append(el('div', 'tier', `${s.tier}: ${w[`tier_name_${lang}`] ?? w.tier}`), row(s.total, cash(w.total, lang), 'total'));
  return c;
}
function slotSet(w, lang) {
  const s = W[lang]; const box = titled('section', s.times); box.classList.add('slotset');
  let day = null; let chips = null;
  w.slots.forEach((slot, i) => {
    const label = slot[`label_${lang}`] ?? slot.label_en;
    const key = slot.start.slice(0, 10);
    if (key !== day) {
      day = key; const m = label.match(/^(.*)[,،]\s*\d{1,2}:\d{2}/);
      const d = el('p', 'day', m ? m[1] : key); d.id = nextId();
      chips = el('div', 'chips'); chips.setAttribute('role', 'group'); chips.setAttribute('aria-labelledby', d.id);
      if (i >= 5) { d.dataset.extra = ''; chips.dataset.extra = ''; }
      box.append(d, chips);
    }
    const b = el('button', 'chip', slot.start.slice(11, 16)); b.type = 'button'; b.dir = 'ltr';
    b.setAttribute('aria-label', label); b.setAttribute('aria-pressed', 'false');
    if (i >= 5) b.dataset.extra = '';
    b.addEventListener('click', () => { b.setAttribute('aria-pressed', 'true'); send(s.slotMsg(label)); });
    chips.append(b);
  });
  if (w.slots.length > 5) {
    const more = el('button', 'btn more', s.more(w.slots.length - 5)); more.type = 'button'; more.setAttribute('aria-expanded', 'false');
    more.addEventListener('click', () => { box.classList.add('open'); more.remove(); box.querySelector('.chip[data-extra]')?.focus(); });
    box.append(more);
  }
  return box;
}
function choice(type, name, text) {
  const l = el('label', 'opt'); const i = el('input'); i.type = type; i.value = text; if (name) i.name = name;
  l.append(i, el('span', '', text)); return l;
}
function detailsPicker(w, lang) {
  const s = W[lang]; const f = el('form', 'card picker'); f.noValidate = true; const group = nextId();
  const tiers = el('fieldset'); tiers.append(el('legend', '', s.level));
  for (const tr of w.tiers) tiers.append(choice('radio', group, nm(tr, lang)));
  const svcs = el('fieldset'); svcs.append(el('legend', '', s.services));
  for (const sv of w.services) svcs.append(choice('checkbox', '', nm(sv, lang)));
  const err = el('p', 'err'); err.setAttribute('role', 'alert');
  const go = el('button', 'btn go', s.sendDetails); go.type = 'submit';
  f.append(tiers, svcs, err, go);
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const tier = tiers.querySelector('input:checked')?.value; const picked = [...svcs.querySelectorAll('input:checked')].map((i) => i.value);
    if (!tier || !picked.length) { err.textContent = s.needDetails; return; }
    err.textContent = ''; send(s.detailsMsg(tier, picked));
  });
  return f;
}
function contactForm(lang) {
  const s = W[lang]; const f = titled('form', s.contactTitle); f.classList.add('picker'); f.noValidate = true;
  const field = (label, ac) => {
    const id = nextId(); const d = el('div', 'field'); const l = el('label', '', label); l.htmlFor = id;
    const i = el('input'); i.id = id; i.type = 'text'; i.autocomplete = ac; i.dir = 'auto'; d.append(l, i); f.append(d); return i;
  };
  const name = field(s.name, 'name'); const contact = field(s.contact, 'email');
  const err = el('p', 'err'); err.setAttribute('role', 'alert');
  const go = el('button', 'btn go', s.sendContact); go.type = 'submit';
  f.append(err, go);
  f.addEventListener('submit', (e) => {
    e.preventDefault(); const n = name.value.trim(); const c = contact.value.trim();
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c) || /^\+?[\d\s-]{7,}$/.test(c);
    if (!n || !ok) { err.textContent = s.needContact; (n ? contact : name).focus(); return; }
    err.textContent = ''; f.replaceWith(el('p', 'sent', s.sentAs(n, c))); send(s.contactMsg(n, c)); // a used form becomes one line
  });
  return f;
}
// The pay step (demo): the amount and reference from the booking, and a simulated button whose label and note come
// from the data file. No card or bank fields; the server pays the booking this session holds, never one sent from here.
const PAY_TEXT = {
  en: { title: 'Pay to confirm your call', ref: 'Booking', amount: 'Amount', ended: 'This chat has ended. Start a new chat to book again.',
    settled: 'Nothing is waiting for payment in this chat.', down: 'The payment did not go through just now. Please press the button again.' },
  ar: { title: 'ادفع لتأكيد مكالمتك', ref: 'الحجز', amount: 'المبلغ', ended: 'انتهت هذه المحادثة. ابدأ محادثة جديدة للحجز مرة أخرى.',
    settled: 'لا يوجد ما ينتظر الدفع في هذه المحادثة.', down: 'لم يتم الدفع الآن. اضغط الزر مرة أخرى من فضلك.' },
};
function payCard(w, lang) {
  const s = PAY_TEXT[lang]; const c = titled('section', s.title); c.classList.add('pay');
  c.append(row(s.ref, w.reference), row(s.amount, cash(w.amount, lang), 'total'));
  if (w[`held_${lang}`]) c.append(el('p', 'tier', w[`held_${lang}`]));
  c.append(el('p', 'tier', w[`note_${lang}`] ?? w.note_en));
  const err = el('p', 'err'); err.setAttribute('role', 'alert');
  const go = el('button', 'btn go', w[`button_${lang}`] ?? w.button_en); go.type = 'button';
  go.addEventListener('click', async () => {
    if (go.disabled || state.busy) return;
    go.disabled = true; err.textContent = '';
    try {
      const res = await fetch('/chat/pay', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId: state.sessionId }) });
      const json = await res.json().catch(() => ({}));
      if (res.ok) { // paid, or the hold ran out: either way the desk says so and this card is done
        if (json.reply) addMsg('desk-msg', json.reply);
        c.closest('.widgets').inert = true; $('input').focus(); return;
      }
      if (res.status === 409) { err.textContent = s.settled; return; }
      if (res.status === 400) { state.sessionId = null; err.textContent = s.ended; return; }
      err.textContent = s.down; go.disabled = false; // 429 or a server error: the press can be tried again
    } catch { err.textContent = s.down; go.disabled = false; }
  });
  c.append(err, go);
  return c;
}
function renderUi(ui, reply) {
  if (!Array.isArray(ui) || !ui.length) return;
  const lang = /[؀-ۿ]/.test(reply ?? '') ? 'ar' : (reply ? 'en' : state.lang);
  const box = el('div', 'widgets'); box.dir = lang === 'ar' ? 'rtl' : 'ltr'; box.lang = lang;
  for (const w of ui) {
    if (w.type === 'quote') box.append(quoteCard(w, lang));
    else if (w.type === 'slots' && w.slots?.length) box.append(slotSet(w, lang));
    else if (w.type === 'details') box.append(detailsPicker(w, lang));
    else if (w.type === 'contact') box.append(contactForm(lang));
    else if (w.type === 'pay') box.append(payCard(w, lang));
  }
  if (box.children.length) { $('log').append(box); $('log').scrollTop = $('log').scrollHeight; }
}
async function send(text) {
  text = text.trim(); if (!text || state.busy) return;
  state.busy = true; $('send').disabled = true;
  for (const w of document.querySelectorAll('.widgets:not([inert])')) w.inert = true; // an answer moves the chat on
  addMsg('you', text); $('input').value = ''; resize();
  const typing = el('div', 'typing', t().typing); $('log').append(typing); $('log').scrollTop = $('log').scrollHeight;
  try {
    const res = await fetch('/chat', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(state.sessionId ? { sessionId: state.sessionId, message: text } : { message: text }) });
    const json = await res.json().catch(() => ({}));
    typing.remove();
    if (json.error?.code === 'unknown_session') { state.sessionId = null; addMsg('note', t().ended); return; }
    if (json.sessionId) state.sessionId = json.sessionId;
    if (json.reply) addMsg('desk-msg', json.reply);
    if (res.ok) renderUi(json.ui, json.reply);
    if (res.status === 429 && !json.reply) addMsg('note', t().busy);
    if (!res.ok && !json.reply) addMsg('note', t().down);
    if (res.ok) { state.turns += 1; logActivity(json); }
  } catch {
    typing.remove(); addMsg('note', t().down);
  } finally {
    state.busy = false; $('send').disabled = false; $('input').focus();
  }
}
function resize() { const i = $('input'); i.style.height = 'auto'; i.style.height = `${Math.min(i.scrollHeight, 160)}px`; }

$('form').addEventListener('submit', (e) => { e.preventDefault(); send($('input').value); });
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); } });
$('input').addEventListener('input', resize);
$('lang').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; applyLang(); });
$('reset').addEventListener('click', () => { state.sessionId = null; state.turns = 0; $('act-list').replaceChildren(); $('log').replaceChildren(); renderEmpty(); $('input').focus(); });
const params = new URLSearchParams(location.search);
if (params.get('lang') === 'en') state.lang = 'en';
if (params.get('theme') === 'dark' || params.get('theme') === 'light') document.documentElement.dataset.theme = params.get('theme');
// The activity panel is open on wide screens and folded on phones, and follows the width when it changes
// (it once stayed folded after a phone-width load was widened, which looked like an empty panel).
const wide = matchMedia('(min-width: 900px)');
$('act').open = wide.matches;
wide.addEventListener('change', (e) => { $('act').open = e.matches; });
applyLang();
</script>
